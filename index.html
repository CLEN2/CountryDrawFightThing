
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FLAG BATTLE</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 font-family:Arial,sans-serif;background:#fff;color:#111;
 overflow:hidden;overscroll-behavior:none;
}
button,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{
 height:100dvh;height:100svh;
 display:flex;flex-direction:column;
 overflow:hidden;
}
#arena{
 position:relative;flex:1;min-height:0;
 background:white;overflow:hidden;touch-action:none;
}
canvas{width:100%;height:100%;display:block;touch-action:none}
#picker{
 flex:0 0 clamp(145px,24dvh,180px);
 min-height:0;
 border-top:1px solid #ddd;background:#f5f5f5;
 display:flex;flex-direction:column;
}
#pickerTop{
 display:flex;gap:7px;padding:7px;
 align-items:center;min-width:0;
}
#search{
 flex:1;min-width:0;width:50%;

 border-radius:8px;font-size:16px;
}
#selected{

}
#stats{

 white-space:nowrap;overflow-x:auto;
 min-height:20px;
}
#flags{
 display:flex;gap:7px;overflow-x:auto;
 overflow-y:hidden;padding:5px 8px;
 align-items:center;flex:1;
 -webkit-overflow-scrolling:touch;
}
.country{
 flex:0 0 55px;height:55px;
 border:2px solid transparent;border-radius:7px;
 background:white;display:flex;align-items:center;
 justify-content:center;flex-direction:column;
 gap:3px;padding:3px;cursor:pointer;
}
.country img{width:43px;height:28px;object-fit:cover}
.country small{
 font-size:9px;white-space:nowrap;
 overflow:hidden;max-width:50px;
}
.country.active{border-color:#111;background:#e4eaff}
#controls{
 flex:0 0 auto;
 min-height:55px;
 display:flex;gap:6px;padding:6px;
 padding-bottom:max(6px,env(safe-area-inset-bottom));
 background:#eee;
}
#controls button{
 flex:1;min-width:0;
 padding:10px 4px;
 border:0;border-radius:8px;
 font-weight:bold;font-size:12px;
 white-space:nowrap;
}
#battle{background:#171717;color:white;flex:1.3!important}
#reset,#undo,#clear{background:#ddd}
#status{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);
 font-size:clamp(16px,4vw,22px);
 font-weight:bold;text-align:center;
 pointer-events:none;color:#333;
 background:#ffffffdd;padding:10px 16px;
 border-radius:10px;max-width:90%;
}
#summonControls{
 position:absolute;left:50%;bottom:8px;
 transform:translateX(-50%);
 display:flex;align-items:center;gap:8px;
 padding:5px 8px;background:#fffffff0;
 border:1px solid #ddd;border-radius:12px;
 z-index:5;box-shadow:0 2px 8px #0002;
 white-space:nowrap;
 touch-action:none;
 user-select:none;
}
#summonControls button{
 width:38px;height:34px;
 border:0;border-radius:8px;
 background:#222;color:white;
 font-size:22px;font-weight:bold;
 padding:0;
}
#summonValue{
 min-width:75px;text-align:center;
 font-size:12px;font-weight:bold;
 padding:8px 3px;
 touch-action:none;
}
#fullscreenBtn{
 position:absolute;top:8px;right:8px;
 z-index:10;
 border:1px solid #aaa;
 border-radius:8px;
 background:#ffffffed;color:#111;
 padding:8px 10px;
 font-size:12px;font-weight:bold;
 box-shadow:0 2px 6px #0002;
}
@media(max-width:520px){
 #picker{flex-basis:clamp(145px,25dvh,175px)}
 #controls{gap:4px;padding:5px}
 #controls button{font-size:11px;padding:10px 2px}
 #pickerTop{gap:5px;padding:6px}
 #selected{font-size:11px;padding:4px}
 #stats{font-size:9px}
 #summonControls{bottom:7px}
 #fullscreenBtn{font-size:11px;padding:7px 8px}
}
@media(max-height:600px){
 #picker{flex-basis:130px}
 #controls{min-height:48px}
 #controls button{padding:7px 3px}
}
</style>
</head>
<body>
<div id="app">
<div id="arena">
<canvas id="game"></canvas>
<div id="status">DRAW YOUR FLAGS!</div>

<button id="fullscreenBtn">⛶ FULLSCREEN</button>

<div id="summonControls">
<button id="summonMinus" aria-label="Spawn fewer flags">−</button>
<div id="summonValue">SPAWN ×1</div>
<button id="summonPlus" aria-label="Spawn more flags">+</button>
</div>
</div>

<div id="picker">
<div id="pickerTop">
<input id="search" placeholder="Search countries..." autocomplete="off">
<div id="selected">Selected: USA</div>
</div>
<div id="stats">MILITARY STATS</div>
<div id="flags"></div>
</div>

<div id="controls">
<button id="undo">UNDO</button>
<button id="clear">CLEAR</button>
<button id="reset">RESET</button>
<button id="battle">⚔️ BATTLE!</button>
</div>
</div>

const rankedCodes=`
us ru cn in kr fr jp gb tr it br de id pk il ir au es eg ua
pl tw vn th sa se dz ca sg gr kp ar ng nl mm mx bd pt no za
ph my co iq dk ch et fi cl pe ve ro uz ae cz ma hu kz ao az
be bg rs cd cu sd at lk sk by qa ec hr jo bh kw al tm tn ly
py bo kh ke td om sy lt tz nz si mz mn ie ge gt uy ye cm tj
am lv hn ml zw ee ug ci kg lu zm gh ss mk do ni cg lb er ne
af na mr np la sn bf me sv bw mg ga ba is pa md so bj xk sl
lr sr cf bz bt
`.trim().split(/\s+/);

const estimatedCodes=`
pg rw sc sz tl tg gm gn gq gw gy ht jm fj sb vu ws to tv ki
nr pw mh fm km cv st ps ag bb dm gd kn lc vc tt bs ad cy li
mc mt mu mv mw bi dj eh va ls bn cr sm
`.trim().split(/\s+/);

const rankMap={};
rankedCodes.forEach((c,i)=>rankMap[c]=i+1);
estimatedCodes.forEach((c,i)=>rankMap[c]=146+i);
countries.forEach(c=>{if(!rankMap[c[1]])rankMap[c[1]]=199;});

function getStats(country){
 const rank=rankMap[country[1]]||199;
 const power=500*Math.pow(1/500,(rank-1)/172);
 return {
  rank,power,
  hp:Math.max(1,Math.round(100*power)),
  damage:Math.max(1,Math.round(24*power)),
  speed:Math.round(42+Math.min(25,Math.max(-5,Math.log2(power)*3))),
  cooldown:Math.max(.16,.55/Math.sqrt(power))
 };
}

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const arena=document.getElementById("arena");
const flagsBox=document.getElementById("flags");
const search=document.getElementById("search");
const statusBox=document.getElementById("status");
const selectedBox=document.getElementById("selected");
const statsBox=document.getElementById("stats");
const summonValue=document.getElementById("summonValue");

let W=0,H=0;
let selected=countries.find(c=>c[1]==="us");
let units=[],history=[],fighting=false,gameOver=false;
let lastTime=0,animationId=0,pointerDown=false,lastSpawn=0;
let winner="",totalHits=0,effects=[];
const flagImages={};

const MELEE_RANGE=53;
const RETREAT_HEALTH=.30;
const SPEED_MULTIPLIER=1.8;

let summonCount=1;
const MIN_SUMMON=1;
const MAX_SUMMON=100;

function updateSummonDisplay(){
 summonValue.textContent="SPAWN ×"+summonCount;
}

function changeSummon(amount){
 if(fighting||gameOver)return;
 summonCount=Math.max(MIN_SUMMON,Math.min(MAX_SUMMON,summonCount+amount));
 updateSummonDisplay();
}

document.getElementById("summonMinus").addEventListener("click",()=>changeSummon(-1));
document.getElementById("summonPlus").addEventListener("click",()=>changeSummon(1));

/* Desktop mouse wheel: up = more, down = less */
arena.addEventListener("wheel",e=>{
 e.preventDefault();
 if(fighting||gameOver)return;
 changeSummon(e.deltaY<0?1:-1);
},{passive:false});

/* Mobile swipe on the SPAWN counter:
   swipe up = more, swipe down = less */
let summonSwipeStartY=null;
let summonSwipeLastY=null;
let summonSwipeDistance=0;

summonValue.addEventListener("pointerdown",e=>{
 if(fighting||gameOver)return;
 e.preventDefault();
 summonSwipeStartY=e.clientY;
 summonSwipeLastY=e.clientY;
 summonSwipeDistance=0;
 summonValue.setPointerCapture(e.pointerId);
});

summonValue.addEventListener("pointermove",e=>{
 if(summonSwipeStartY===null)return;
 e.preventDefault();
 const delta=summonSwipeLastY-e.clientY;
 summonSwipeDistance+=delta;
 summonSwipeLastY=e.clientY;

 const steps=Math.trunc(summonSwipeDistance/22);
 if(steps!==0){
  changeSummon(steps);
  summonSwipeDistance-=steps*22;
 }
});

function endSummonSwipe(){
 summonSwipeStartY=null;
 summonSwipeLastY=null;
 summonSwipeDistance=0;
}
summonValue.addEventListener("pointerup",endSummonSwipe);
summonValue.addEventListener("pointercancel",endSummonSwipe);

/* Fullscreen */
const fullscreenBtn=document.getElementById("fullscreenBtn");

async function toggleFullscreen(){
 try{
  if(!document.fullscreenElement){
   const target=document.getElementById("app");
   if(target.requestFullscreen){
    await target.requestFullscreen();
   }else if(target.webkitRequestFullscreen){
    target.webkitRequestFullscreen();
   }
  }else{
   await document.exitFullscreen();
  }
 }catch(error){
  console.log("Fullscreen is unavailable in this browser.",error);
 }
}

fullscreenBtn.addEventListener("click",toggleFullscreen);

function updateFullscreenButton(){
 const active=!!document.fullscreenElement;
 fullscreenBtn.textContent=active?"✕ EXIT FULLSCREEN":"⛶ FULLSCREEN";
 setTimeout(resize,100);
}

document.addEventListener("fullscreenchange",updateFullscreenButton);
document.addEventListener("webkitfullscreenchange",updateFullscreenButton);

function getImage(code){
 if(!flagImages[code]){
  const img=new Image();
  img.src="https://flagcdn.com/w80/"+code+".png";
  flagImages[code]=img;
 }
 return flagImages[code];
}

function updateStats(){
 const s=getStats(selected);
 selectedBox.textContent="Selected: "+selected[0];
 statsBox.textContent="RANK #"+s.rank+
 " | POWER "+s.power.toFixed(2)+
 " | HP "+s.hp+" | ATK "+s.damage+
 " | SPEED "+Math.round(s.speed*SPEED_MULTIPLIER)+
 " | MELEE ONLY";
}

function resize(){
 const rect=arena.getBoundingClientRect();
 const dpr=Math.min(window.devicePixelRatio||1,2);
 W=rect.width;H=rect.height;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 draw();
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,150));

renderPicker();
function renderPicker(list=countries){
 flagsBox.innerHTML="";
 list.forEach(country=>{
  const b=document.createElement("button");
  b.className="country"+(selected[1]===country[1]?" active":"");
  const img=document.createElement("img");
  img.src="https://flagcdn.com/w80/"+country[1]+".png";
  img.alt=country[0];
  const label=document.createElement("small");
  label.textContent=country[0];
  b.append(img,label);
  b.onclick=()=>{
   selected=country;
   updateStats();
   renderPicker(countries.filter(c=>c[0].toLowerCase().includes(search.value.toLowerCase())));
  };
  flagsBox.appendChild(b);
 });
}

search.addEventListener("input",()=>{
 renderPicker(countries.filter(c=>c[0].toLowerCase().includes(search.value.toLowerCase())));
});
updateStats();
renderPicker();
updateSummonDisplay();

function makeUnit(x,y,team){
 const s=getStats(selected);
 return {
  id:Math.random(),x,y,team,country:selected,
  rank:s.rank,power:s.power,
  hp:s.hp,maxHp:s.hp,damage:s.damage,
  speed:s.speed*SPEED_MULTIPLIER,
  cooldown:Math.max(.18,s.cooldown*.35),
  attackCooldown:Math.random()*.15,
  flash:0,angle:team===0?0:Math.PI,size:35,
  attackAnim:0,retreating:false,hitCount:0,
  deathTime:0,stuckTime:0,sidestepTime:0,
  sidestepDir:Math.random()<.5?-1:1,
  avoidTargetId:null,avoidTargetTime:0,targetId:null
 };
}

function spawnAt(x,y){
 if(fighting||gameOver)return;
 const team=x<W/2?0:1;

 for(let i=0;i<summonCount;i++){
  const angle=Math.random()*Math.PI*2;
  const radius=i===0?0:12+Math.sqrt(i)*13;
  const sx=Math.max(20,Math.min(W-20,x+Math.cos(angle)*radius));
  const sy=Math.max(50,Math.min(H-20,y+Math.sin(angle)*radius));
  const u=makeUnit(sx,sy,team);
  units.push(u);
  history.push(u.id);
 }
 draw();
}

function getPointer(e){
 const r=canvas.getBoundingClientRect();
 return{x:e.clientX-r.left,y:e.clientY-r.top};
}

canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(fighting||gameOver)return;
 pointerDown=true;
 canvas.setPointerCapture(e.pointerId);
 const p=getPointer(e);
 spawnAt(p.x,p.y);
});

canvas.addEventListener("pointermove",e=>{
 if(!pointerDown||fighting||gameOver)return;
 const p=getPointer(e);
 const now=performance.now();
 if(now-lastSpawn>55){
  const last=units[units.length-1];
  if(!last||Math.hypot(last.x-p.x,last.y-p.y)>20){
   spawnAt(p.x,p.y);
   lastSpawn=now;
  }
 }
});
canvas.addEventListener("pointerup",()=>pointerDown=false);
canvas.addEventListener("pointercancel",()=>pointerDown=false);
window.addEventListener("pointerup",()=>pointerDown=false);
window.addEventListener("blur",()=>pointerDown=false);

function nearestEnemy(u){
 let best=null,bestScore=Infinity,fallback=null,fallbackDist=Infinity;
 for(const v of units){
  if(v.team===u.team||v.hp<=0)continue;
  const d=Math.hypot(v.x-u.x,v.y-u.y);
  if(d<fallbackDist){fallbackDist=d;fallback=v;}
  let assigned=0;
  for(const ally of units){
   if(ally!==u&&ally.hp>0&&ally.team===u.team&&ally.targetId===v.id)assigned++;
  }
  const avoiding=u.avoidTargetTime>0&&u.avoidTargetId===v.id;
  const score=d+assigned*48+(avoiding?260:0);
  if(score<bestScore){bestScore=score;best=v;}
 }
 if(!best)best=fallback;
 if(best)u.targetId=best.id;
 return best?{unit:best,dist:Math.hypot(best.x-u.x,best.y-u.y)}:null;
}

function nearestMeleeEnemy(u){
 let best=null,bestDist=Infinity;
 for(const v of units){
  if(v.team===u.team||v.hp<=0)continue;
  const d=Math.hypot(v.x-u.x,v.y-u.y);
  if(d<=MELEE_RANGE&&d<bestDist){best=v;bestDist=d;}
 }
 return best?{unit:best,dist:bestDist}:null;
}

function separationVector(u){
 let sx=0,sy=0;
 for(const v of units){
  if(v===u||v.hp<=0||v.team!==u.team)continue;
  const dx=u.x-v.x,dy=u.y-v.y,d=Math.hypot(dx,dy),radius=43;
  if(d>0&&d<radius){
   const force=(radius-d)/radius;
   sx+=(dx/d)*force;sy+=(dy/d)*force;
  }else if(d===0){
   const a=((u.id*100000+v.id*1000)%628)/100;
   sx+=Math.cos(a);sy+=Math.sin(a);
  }
 }
 return{x:sx,y:sy};
}

function attack(u,target){
 if(!target||target.hp<=0)return;
 const damageDone=Math.min(target.hp,u.damage);
 target.hp=Math.max(0,target.hp-damageDone);
 target.flash=.24;
 target.hitCount++;
 u.hitCount++;
 u.attackAnim=.24;
 if(target.hp===0){
  target.deathTime=.5;
  target.retreating=false;
 }
 totalHits++;
 effects.push({
  x:target.x,y:target.y-22,
  text:"-"+damageDone,life:.7,maxLife:.7
 });
}

function moveToward(u,target,dt){
 const dx=target.x-u.x,dy=target.y-u.y;
 const dist=Math.max(.001,Math.hypot(dx,dy));
 u.angle=Math.atan2(dy,dx);
 if(dist<=MELEE_RANGE-4)return;
 const sep=separationVector(u);
 let vx=dx/dist+sep.x*1.35,vy=dy/dist+sep.y*1.35;
 if(u.sidestepTime>0){
  vx+=(-dy/dist)*u.sidestepDir*.9;
  vy+=(dx/dist)*u.sidestepDir*.9;
 }
 const len=Math.max(.001,Math.hypot(vx,vy));
 const move=Math.min(u.speed*dt,Math.max(0,dist-(MELEE_RANGE-4)));
 u.x+=(vx/len)*move;
 u.y+=(vy/len)*move;
}

function separateOverlappingAllies(u){
 for(const v of units){
  if(v===u||v.hp<=0||v.team!==u.team)continue;
  let dx=u.x-v.x,dy=u.y-v.y,d=Math.hypot(dx,dy);
  const minDist=25;
  if(d<minDist){
   if(d<.01){
    const a=((u.id*100000+v.id*1000)%628)/100;
    dx=Math.cos(a);dy=Math.sin(a);d=1;
   }
   const push=(minDist-d)*.38;
   u.x+=(dx/d)*push;u.y+=(dy/d)*push;
  }
 }
}

function runAway(u,target,dt){
 const dx=u.x-target.x,dy=u.y-target.y;
 const dist=Math.max(.001,Math.hypot(dx,dy));
 u.angle=Math.atan2(-dy,-dx);
 const move=u.speed*1.35*dt;
 u.x+=(dx/dist)*move;
 u.y+=(dy/dist)*move;
}

function update(dt){
 if(!fighting)return;
 const alive=units.filter(u=>u.hp>0);
 const red=alive.filter(u=>u.team===0);
 const blue=alive.filter(u=>u.team===1);

 if(red.length===0||blue.length===0){
  fighting=false;
  gameOver=true;
  winner=red.length?"RED TEAM":"BLUE TEAM";
  statusBox.style.display="block";
  statusBox.textContent=winner+" WINS! 🏆";
  document.getElementById("battle").textContent="NEW BATTLE";
  return;
 }

 for(const u of alive){
  u.attackCooldown=Math.max(0,u.attackCooldown-dt);
  u.flash=Math.max(0,u.flash-dt);
  u.attackAnim=Math.max(0,u.attackAnim-dt);
  u.sidestepTime=Math.max(0,u.sidestepTime-dt);
  u.avoidTargetTime=Math.max(0,u.avoidTargetTime-dt);

  const info=nearestEnemy(u);
  if(!info)continue;

  const healthRatio=u.hp/u.maxHp;
  if(healthRatio<=RETREAT_HEALTH)u.retreating=true;
  if(u.retreating&&healthRatio>.45)u.retreating=false;

  const forcedEnemy=nearestMeleeEnemy(u);
  const forcedToFight=u.retreating&&!!forcedEnemy;
  const oldX=u.x,oldY=u.y;

  if(u.retreating&&!forcedToFight){
   runAway(u,info.unit,dt);
  }else{
   moveToward(u,info.unit,dt);
  }

  separateOverlappingAllies(u);
  u.x=Math.max(18,Math.min(W-18,u.x));
  u.y=Math.max(45,Math.min(H-18,u.y));

  const moved=Math.hypot(u.x-oldX,u.y-oldY);
  const nowDist=Math.hypot(info.unit.x-u.x,info.unit.y-u.y);

  if(!u.retreating&&nowDist>MELEE_RANGE+8&&moved<.45){
   u.stuckTime+=dt;
   if(u.stuckTime>.38){
    u.sidestepDir*=-1;
    u.sidestepTime=.75;
    u.avoidTargetId=info.unit.id;
    u.avoidTargetTime=.9;
    u.stuckTime=0;
    u.x+=u.sidestepDir*5;
    u.y+=((u.id%2)?1:-1)*3;
   }
  }else u.stuckTime=0;
 }

 for(const u of alive){
  if(u.hp<=0||u.attackCooldown>0)continue;
  const info=nearestMeleeEnemy(u);
  if(!info)continue;
  attack(u,info.unit);
  u.attackCooldown=u.cooldown;
 }

 for(let i=effects.length-1;i>=0;i--){
  const e=effects[i];
  e.life-=dt;
  e.y-=28*dt;
  if(e.life<=0)effects.splice(i,1);
 }
}

function drawFlag(u){
 const s=u.size;
 const dead=u.hp<=0;
 let lunge=0;
 if(u.attackAnim>0&&!dead){
  const progress=1-u.attackAnim/.24;
  lunge=Math.sin(progress*Math.PI)*12;
 }
 const drawX=u.x+Math.cos(u.angle)*lunge;
 const drawY=u.y+Math.sin(u.angle)*lunge;

 ctx.save();
 ctx.translate(drawX,drawY);

 if(dead){
  ctx.globalAlpha=.48;
  ctx.filter="grayscale(1)";
 }else if(u.flash>0){
  ctx.fillStyle="rgba(255,0,0,.5)";
  ctx.beginPath();
  ctx.arc(0,0,s*.85,0,Math.PI*2);
  ctx.fill();
 }

 if(!dead&&u.retreating){
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillStyle="#d97706";
  ctx.fillText("!",0,-s*.7-12);
 }

 ctx.fillStyle="#222";
 ctx.fillRect(-s/2-1,-s*.32-1,s+2,s*.64+2);
 const img=getImage(u.country[1]);

 if(img.complete&&img.naturalWidth){
  ctx.drawImage(img,-s/2,-s*.32,s,s*.64);
 }else{
  ctx.fillStyle="#bbb";
  ctx.fillRect(-s/2,-s*.32,s,s*.64);
 }

 ctx.strokeStyle="#333";
 ctx.lineWidth=1;
 ctx.strokeRect(-s/2,-s*.32,s,s*.64);

 const barW=34;
 const barY=-s*.32-8;
 ctx.fillStyle="#d5d5d5";
 ctx.fillRect(-barW/2,barY,barW,5);
 const ratio=dead?0:Math.max(0,Math.min(1,u.hp/u.maxHp));

 if(ratio>0){
  ctx.fillStyle=ratio<=.3?"#e67e22":
   (u.team===0?"#e52222":"#1765e8");
  ctx.fillRect(-barW/2,barY,barW*ratio,5);
 }

 ctx.strokeStyle="#555";
 ctx.lineWidth=.7;
 ctx.strokeRect(-barW/2,barY,barW,5);
 ctx.restore();

 if(dead){
  ctx.save();
  ctx.globalAlpha=.9;
  ctx.font="bold 10px Arial";
  ctx.textAlign="center";
  ctx.fillStyle="#555";
  ctx.fillText("DEAD",u.x,u.y+s*.32+12);
  ctx.restore();
 }
}

function draw(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="#999";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(W/2,0);
 ctx.lineTo(W/2,H);
 ctx.stroke();

 ctx.textAlign="center";
 ctx.font="bold 19px Arial";
 ctx.fillStyle="#e52222";
 ctx.fillText("RED TEAM",W*.25,25);
 ctx.fillStyle="#1765e8";
 ctx.fillText("BLUE TEAM",W*.75,25);

 const red=units.filter(u=>u.team===0&&u.hp>0).length;
 const blue=units.filter(u=>u.team===1&&u.hp>0).length;

 ctx.font="bold 13px Arial";
 ctx.fillStyle="#e52222";
 ctx.fillText("FLAGS: "+red,W*.25,45);
 ctx.fillStyle="#1765e8";
 ctx.fillText("FLAGS: "+blue,W*.75,45);

 if(fighting||gameOver){
  ctx.font="bold 12px Arial";
  ctx.fillStyle="#333";
  ctx.fillText("HITS: "+totalHits,W/2,18);
 }

 const drawOrder=[...units].sort((a,b)=>{
  if((a.hp<=0)!==(b.hp<=0))return a.hp<=0?-1:1;
  return a.y-b.y;
 });
 for(const u of drawOrder)drawFlag(u);

 for(const e of effects){
  ctx.globalAlpha=Math.max(0,e.life/e.maxLife);
  ctx.font="bold 15px Arial";
  ctx.textAlign="center";
  ctx.lineWidth=3;
  ctx.strokeStyle="white";
  ctx.strokeText(e.text,e.x,e.y);
  ctx.fillStyle="#e00000";
  ctx.fillText(e.text,e.x,e.y);
  ctx.globalAlpha=1;
 }

 if(!fighting&&!gameOver){
  ctx.font="13px Arial";
  ctx.fillStyle="#777";
  ctx.fillText("DRAW FLAGS ON EITHER SIDE",W/2,H-12);
 }
}

function loop(time){
 const dt=Math.min((time-lastTime)/1000||0,.04);
 lastTime=time;
 update(dt);
 draw();
 if(fighting)animationId=requestAnimationFrame(loop);
}

function startBattle(){
 if(
  units.filter(u=>u.team===0&&u.hp>0).length===0||
  units.filter(u=>u.team===1&&u.hp>0).length===0
 ){
  statusBox.style.display="block";
  statusBox.textContent="DRAW FLAGS ON BOTH SIDES FIRST!";
  return;
 }
 fighting=true;
 gameOver=false;
 statusBox.style.display="none";
 document.getElementById("battle").textContent="⏸ PAUSE";
 lastTime=performance.now();
 cancelAnimationFrame(animationId);
 animationId=requestAnimationFrame(loop);
}

function toggleBattle(){
 if(gameOver){
  resetGame();
  return;
 }
 if(fighting){
  fighting=false;
  cancelAnimationFrame(animationId);
  document.getElementById("battle").textContent="▶ RESUME";
  statusBox.style.display="block";
  statusBox.textContent="PAUSED";
 }else{
  startBattle();
 }
}

function resetGame(){
 fighting=false;
 gameOver=false;
 winner="";
 totalHits=0;
 effects=[];
 cancelAnimationFrame(animationId);
 units=[];
 history=[];
 statusBox.style.display="block";
 statusBox.textContent="DRAW YOUR FLAGS!";
 document.getElementById("battle").textContent="⚔️ BATTLE!";
 draw();
}

function undo(){
 if(fighting||gameOver)return;
 const id=history.pop();
 if(id!==undefined)units=units.filter(u=>u.id!==id);
 draw();
}

function clearTeam(){
 if(fighting||gameOver)return;
 units=[];
 history=[];
 effects=[];
 totalHits=0;
 draw();
}

document.getElementById("battle").onclick=toggleBattle;
document.getElementById("reset").onclick=resetGame;
document.getElementById("undo").onclick=undo;
document.getElementById("clear").onclick=clearTeam;

resize();
</script>
</body>
</html>
